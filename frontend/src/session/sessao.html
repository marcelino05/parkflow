<!DOCTYPE html>
<html lang="pt-MZ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkFlow - Sessões</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../utils/global.css">
  <link rel="stylesheet" href="../utils/toast.css">
  <link rel="stylesheet" href="./session.css">
</head>

<body>
  
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="logo">
        Park<b>Flow</b>
      </div>
      
      <i class="bi bi-x-lg close-icon" id="closeMenu"></i>
    </div>
    <nav>
      <a href="../dashboard/dashboard.html" class="only-admin">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      
      <a href="./sessao.html" >
        <i class="bi bi-car-front"></i> Sessões
      </a>
      
      <a href="../parking/parking.html">
        <i class="bi bi-p-square"></i> Estacionamento
      </a>
      
      <a href="../operators/operator.html" class="only-admin">
        <i class="bi bi-person"></i> Operadores
      
      <a href="../company/companyInfo.html" class="only-admin">
        <i class="bi bi-buildings"></i> Empresa
      </a>
      
      <a href="../histories/history.html" >
        <i class="bi bi-clock-history"></i> Histórico
      </a>
      
      <a href="../settings/setting.html" class="only-admin">
        <i class="bi bi-gear"></i> Configurações
      </a>
    </nav>
  </aside>
  
  <!-- LAYOUT -->
  <div class="layout">
    
    <!-- HEADER -->
    <header class="header">
      <div class="left">
        <span id="btn-menu">
          <i class="bi bi-list"></i>
        </span>
        <h3>Sessão</h3>
      </div>
      
      <div class="right">
        <input type="search" class="input" placeholder="Pesquise a placa">
        <i class="bi bi-moon" id="themeBtn"></i>
      </div>
    </header>
    
    <!-- MAIN -->
    <main class="main">
      
      <!-- CARDS -->
      <section class="cards">
        
        <div class="card active">
          <div class="icon"><i class="bi bi-car-front"></i></div>
          <div class="info">
            <span>Ativos</span>
            <h2 id="active">0</h2>
          </div>
        </div>
        
        <div class="card entry">
          <div class="icon"><i class="bi bi-currency-dollar"></i></div>
          <div class="info">
            <span>Entradas</span>
            <h2 id="entry">0</h2>
          </div>
        </div>
        
        <div class="card available">
          <div class="icon"><i class="bi bi-p-square"></i></div>
          <div class="info">
            <span>Vagas</span>
            <h2 id="available">0</h2>
          </div>
        </div>
        
      </section>
      
      <!-- SESSÕES -->
      <section class="pf-activities">
        
        <h2>Movimentações</h2>
        
        <!-- TABS -->
        <div class="pf-tabs">
          <button class="tab active" id="tabEntrada">
            <i class="bi bi-box-arrow-in-right"></i> Entrada
          </button>
          
          <button class="tab" id="tabSaida">
            <i class="bi bi-box-arrow-right"></i> Saída
          </button>
        </div>
        
        <!-- FORM -->
        <div class="pf-form">
          
          <div class="pf-input-group" id="select-parking">
            <i class="bi bi-p-square"></i>
            <select id="estacionamentoSelect"></select>
          </div>
          
          <div class="pf-input-group">
            <i class="bi bi-car-front"></i>
            <input type="text" id="placa" placeholder="Digite a placa" autocomplete="off">
          </div>
          
          <button id="btnAction" class="pf-button">
            <i class="bi bi-box-arrow-in-right"></i>
            Confirmar
          </button>
          
        </div>
        
        <!-- LISTA -->
        <div class="pf-list" id="listSessions">
          
          <div class="empty" id="emptyState">
            <i class="bi bi-inbox"></i>
            <p>Nenhuma movimentação registrada</p>
          </div>
          
        </div>
        
      </section>
      
    </main>
  </div>
  
  <script type="module" src="./session.js" defer></script>
  <script src="../utils/global.js" defer></script>
  <script>
    document.getElementById("closeMenu").addEventListener("click", () => {
      document.querySelector(".sidebar").classList.remove("active");
    });
  </script>
</body>

</html>
