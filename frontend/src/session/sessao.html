<!DOCTYPE html>
<html lang="pt-MZ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkFlow sessoes</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="./session.css">
  <link rel="stylesheet" href="../utils/global.css">
  
</head>

<body>
  
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <h2 class="logo">Park<b>Flow</b></h2>
    
    <nav>
      <a href="../dashboard/dashboard.html">
        <i class="bi bi-speedometer2"></i>Dashboard
      </a>
      <a href="./sessao.html">
        <i class="bi bi-car-front"></i>Sessões
      </a>
      <a href="../parking/parking.html" id="menuParking">
        <i class="bi bi-p-square"></i> Estacionamento
      </a>
      <a href="#">
        <i class="bi bi-person"></i> Operadores
      </a>
      <a href="../company/companyInfo.html">
        <i class="bi bi-buildings"></i>Empresa
      </a>
      <a href="../company/companyInfo.html">
        <i class="bi bi-buildings"></i>Empresa
      </a>
      <a href="#">
        <i class="bi bi-clock-history"></i> Histórico
      </a>
      <a href="#">
        <i class="bi bi-gear"></i> Configurações
      </a>
    </nav>
  </aside>
  
  <!-- MAIN -->
  <div class="layout">
    
    <!-- HEADER -->
    <header class="header">
      <div class="left">
        <span id="btn-menu">
          <i class="bi bi-list"></i>
        </span>
        <h3>Sessão</h3>
      </div>
      
      <div class="right">
        <input type="search" name="pesquisa" class="input" placeholder="Pesquise a placa">
        <i class="bi bi-moon" id="themeBtn"></i>
      </div>
    </header>
    
    <!-- CONTENT -->
    <main class="main">
      <section class="cards">
        
        <div class="card active">
          <div class="icon">
            <i class="bi bi-car-front"></i>
          </div>
          
          <div class="info">
            <span>Carros ativos</span>
            <h2 id="active">0</h2>
          </div>
        </div>
        
        <div class="card entry">
          <div class="icon">
            <i class="bi bi-currency-dollar"></i>
          </div>
          
          <div class="info">
            <span>Entradas</span>
            <h2 id="entry">0</h2>
          </div>
        </div>
        
        <div class="card available">
          <div class="icon">
            <i class="bi bi-p-square"></i>
          </div>
          
          <div class="info">
            <span>Vagas disponíveis</span>
            <h2 id="available">0</h2>
          </div>
        </div>
      </section>
      
      <section class="activities">
        
        <h2>Movimentações</h2>
        
        <!-- 🔥 TABS: Entrada / Saída -->
        <div class="activity-tabs">
          <button class="tab active" id="tabEntrada">
            <i class="bi bi-box-arrow-in-right"></i>
            Entrada
          </button>
          
          <button class="tab" id="tabSaida">
            <i class="bi bi-box-arrow-right"></i>
            Saída
          </button>
        </div>
        
        <!-- 🔥 FORMULÁRIO -->
        <div class="activity">
          
          <div class="input-group">
            <i class="bi bi-car-front"></i>
            
            <input type="text" id="placa" placeholder="Digite a placa" autocomplete="off" />
          </div>
          
          <!-- BOTÃO DINÂMICO -->
          <button id="btnAction">
            <i class="bi bi-box-arrow-in-right"></i>
            Registrar Entrada
          </button>
          
        </div>
        
        <!-- 🔥 LISTA -->
        <div class="list-cards" id="listSessions">
          
          <div class="empty" id="emptyState">
            <i class="bi bi-inbox"></i>
            <p>Nenhuma movimentação registrada</p>
          </div>
          
        </div>
        
      </section>
    </main>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./session.js" defer></script>
  <script src="../utils/global.js" defer></script>
</body>

</html>
