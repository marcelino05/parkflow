<!DOCTYPE html>
<html lang="pt-MZ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkFlow sessoes</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="./session.css">
  <link rel="stylesheet" href="../utils/global.css">
  
</head>

<body>
  
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <h2 class="logo">Park<b>Flow</b></h2>
    
    <nav>
      <a href="../dashboard/dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="./sessao.html"><i class="bi bi-car-front"></i> Sessões</a>
      <a href="../parking/parking.html" id="menuParking"><i class="bi bi-p-square"></i> Estacionamento</a>
      <a href="#"><i class="bi bi-person"></i> Operadores</a>
      <a href="../company/companyInfo.html"><i class="bi bi-buildings"></i>Empresa</a>
      <a href="../company/companyInfo.html"><i class="bi bi-buildings"></i>Empresa</a>
      <a href="#"><i class="bi bi-clock-history"></i> Histórico</a>
      <a href="#"><i class="bi bi-gear"></i> Configurações</a>
    </nav>
  </aside>
  
  <!-- MAIN -->
  <div class="layout">
    
    <!-- HEADER -->
    <header class="header">
      
      <div class="left">
        <span id="btn-menu"><i class="bi bi-list"></i></span>
        <h3>Sessão</h3>
      </div>
      
      <div class="right">
        <input type="search" name="pesquisa" class="input" placeholder="Pesquise a placa">
        <i class="bi bi-moon" id="themeBtn"></i>
      </div>
      
    </header>
    
    <!-- CONTENT -->
    <main class="main">
      
      <div class="content-wrapper">
    <div class="stats-grid">
      <div class="stat-card">
        <span>Veículos Atuais</span>
        <h3 id="contador">0</h3>
      </div>
      <div class="stat-card">
        <span>Receita Estimada</span>
        <h3 id="receita-total">0 MT</h3>
      </div>
    </div>

    <div class="control-panel">
      <div class="input-wrapper">
        <input id="placa" placeholder="Placa do veículo (ex: ABC-1234)" maxlength="8">
      </div>
      <button class="btn btn-primary" onclick="entrada()">Adicionar</button>
    </div>

    <div id="lista" class="grid-veiculos">
      </div>
  </div>
</main>

<button id="saidaBtn" class="btn floating-action" onclick="saida()">
  Confirmar Saída (Checkout)
</button>

    </main>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./session.js" defer></script>
  <script src="../utils/global.js" defer></script>
</body>

</html>
