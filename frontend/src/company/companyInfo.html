<!DOCTYPE html>
<html lang="pt-MZ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkFlow Dashboard</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="./companyInfo.css">
  <link rel="stylesheet" href="../utils/toast.css">
  <link rel="stylesheet" href="../utils/global.css">
  
</head>

<body>
  
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <h2 class="logo">Park<b>Flow</b></h2>
    
    <nav>
      <a href="../dashboard/dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="../session/sessao.html"><i class="bi bi-car-front"></i> Sessões</a>
      <a href="../parking/parking.html" id="menuParking"><i class="bi bi-p-square"></i> Estacionamento</a>
      <a href="#"><i class="bi bi-person"></i> Operadores</a>
      <a href="./companyInfo.html"><i class="bi bi-buildings"></i>Empresa</a>
      <a href="#"><i class="bi bi-clock-history"></i> Histórico</a>
      <a href="#"><i class="bi bi-gear"></i> Configurações</a>
    </nav>
  </aside>
  
  <!-- MAIN -->
  <div class="layout">
    
    <!-- HEADER -->
    <header class="header">
      <div class="left">
        <span id="btn-menu"><i class="bi bi-list"></i></span>
        <h3>Dashboard</h3>
        
        <!-- FIX: ID duplicado -->
        <h4 id="companyNameHeader"></h4>
      </div>
      
      <div class="right">
        <i class="bi bi-bell"></i>
        <i class="bi bi-moon" id="themeBtn"></i>
        <a href="#" class="btn-primary">Plano</a>
      </div>
    </header>
    
    <!-- CONTENT -->
   <main class="main">
  <div class="top-info">
    <h2>Informações da empresa </h2>
    <p><a href="./company.html"><button>Criar empresa</button></a></p>
  </div>
  <section class="company-section">
    
    <!-- INFORMAÇÕES DA EMPRESA -->
    <div class="company-card">
      
      <div class="company-header">
        <h2 id="companyName">---</h2>
        <span id="companyPlan" class="plan"></span>
      </div>
      
      <div class="company-info">
        <p><strong>Proprietário:</strong> <span id="companyOwner">---</span></p>
        
        <p><strong>Email:</strong> <span id="companyEmail"></span></p>
        <p><strong>Telefone:</strong> <span id="companyPhone"></span></p>
        <p><strong>Endereço:</strong> <span id="companyAddress"></span></p>
      </div>
      
    </div>
    
    <!-- PLANO -->
    <div class="company-card">
      
      <h3>Plano</h3>
      
      <p><strong>Ativo:</strong> <span id="companyPlanoAtivo"></span></p>
      
      <p><strong>Data de início:</strong> <span id="companyPlanoInicio"></span></p>
      
      <p><strong>Expira em:</strong> <span id="companyPlanoFim"></span></p>
      
      <p><strong>Criado em:</strong> <span id="companyCreated"></span></p>
      
    </div>
    
    <!-- LIMITES -->
    <div class="company-card">
      
      <h3>Limites</h3>
      
      <div class="limit">
        <span>Estacionamentos</span>
        <div class="bar">
          <div id="barParking" class="progress"></div>
        </div>
        <small id="textParking"></small>
      </div>
      
      <div class="limit">
        <span>Operadores</span>
        <div class="bar">
          <div id="barOperators" class="progress"></div>
        </div>
        <small id="textOperators"></small>
      </div>
      
      <div class="limit">
        <span>Vagas</span>
        <div class="bar">
          <div id="barSpots" class="progress"></div>
        </div>
        <small id="textSpots"></small>
      </div>
      
    </div>
    
  </section>
  
</main>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="./companyInfo.js" defer></script>
  <script src="../utils/global.js" defer></script>
</body>
</html>
