<!DOCTYPE html>
<html lang="pt-MZ">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkFlow Dashboard</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./dashboard.css">
  <link rel="stylesheet" href="../utils/global.css">
  
</head>

<body>
  
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <h2 class="logo">Park<b>Flow</b></h2>
    
    <nav>
      <a href="./dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="../session/sessao.html"><i class="bi bi-car-front"></i> Sessões</a>
      <a href="../parking/parking.html" id="menuParking"><i class="bi bi-p-square"></i> Estacionamento</a>
      <a href="#"><i class="bi bi-person"></i> Operadores</a>
      <a href="../company/companyInfo.html"><i class="bi bi-buildings"></i>Empresa</a>
      <a href="#"><i class="bi bi-clock-history"></i> Histórico</a>
      <a href="#"><i class="bi bi-gear"></i> Configurações</a>
    </nav>
  </aside>
  
  <!-- MAIN -->
  <div class="layout">
    
    <!-- HEADER -->
    <header class="header">
      <div class="left">
        <span id="btn-menu"><i class="bi bi-list"></i></span>
        <h3>Dashboard</h3>
        
        <h4 id="companyName"></h4>
      </div>
      
      <div class="right">
        <i class="bi bi-bell"></i>
        <i class="bi bi-moon" id="themeBtn"></i>
        <a href="#" class="btn-primary">Plano</a>
      </div>
    </header>
    
    <!-- CONTENT -->
    <main class="main">
      
      <!-- CARDS -->
      <section class="cards">
        
        <div class="card receita">
          <div class="card-header">
            <div class="icon"><i class="bi bi-currency-dollar"></i></div>
            <div class="info">
              <span>Receita hoje</span>
              <h2 id="receita">0 MZN</h2>
            </div>
          </div>
        </div>
        
        <div class="card ativos">
          <div class="card-header">
            <div class="icon"><i class="bi bi-car-front"></i></div>
            <div class="info">
              <span>Carros ativos</span>
              <h2 id="ativos">0</h2>
            </div>
          </div>
        </div>
        
        <div class="card entradas">
          <div class="card-header">
            <div class="icon"><i class="bi bi-box-arrow-in-down"></i></div>
            <div class="info">
              <span>Entradas</span>
              <h2 id="entradas">0</h2>
            </div>
          </div>
        </div>
        
        <div class="card vagas">
          <div class="card-header">
            <div class="icon"><i class="bi bi-p-square"></i></div>
            <div class="info">
              <span>Vagas livres</span>
              <h2 id="vagas">0</h2>
            </div>
          </div>
          
        </div>
      </section>
      
      <!-- CHARTS -->
      <section class="charts">
        <div class="chart-box">
          <h3>Receita Semanal</h3>
          <canvas id="chart1"></canvas>
        </div>
        
        <div class="chart-box">
          <h3>Entradas por hora</h3>
          <canvas id="chart2"></canvas>
        </div>
      </section>
      
    </main>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./dashboard-config.js" defer></script>
  <script src="./dashboard.js" defer></script>
  <script src="../utils/global.js" defer></script>
</body>
</html>
