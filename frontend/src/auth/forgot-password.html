<!DOCTYPE html>
<html lang="pt-Mz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkFlow - Esqueci Senha</title>
  
  <link rel="stylesheet" href="../utils/global.css">
  <link rel="stylesheet" href="../utils/toast.css">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--fundo);
      
    }
    
    .card {
      width: 380px;
      padding: 28px;
      border-radius: var(--radius);
      background: var(--card);
      color: var(--texto);
      border: 1px solid var(--borda);
      box-shadow: var(--sombra);
      
    }
    
    .logo {
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 18px;
      text-align: center;
      color: var(--cor-primaria);
      
    }
    
    
    .title {
      font-size: 20px;
      text-align: center;
      color: var(--texto);
      
    }
    
    .subtitle {
      font-size: 13px;
      margin-bottom: 25px;
      text-align: center;
      color: var(--sub);
      
    }
    
    /* INPUT GROUP */
    .input-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--borda);
      border-radius: 10px;
      padding: 10px 12px;
      background: transparent;
      transition: 0.2s;
      
    }
    
    .input-group:focus-within {
      border-color: var(--cor-primaria);
      
    }
    
    .input-group input {
      width: 100%;
      background: transparent;
      color: var(--texto);
      font-weight: bolder;
      font-size: 1em;
      
    }
    
    .input-group i {
      margin-left: 10px;
      color: var(--sub);
      font-size: 18px;
      
    }
    
    .btn {
      width: 100%;
      padding: 11px;
      margin-top: 16px;
      background: var(--cor-primaria);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      
    }
    
    .btn:hover {
      background: var(--cor-primaria-hover);
      
    }
    
    @media screen and (min-width: 668px) {
      .card {
        width: 410px;
        height: 360px;
        
      }
      
      .logo {
        font-size: 2.4em;
        
      }
      
      .subtitle {
        margin-bottom: 30px;
        
      }
    }
  </style>
</head>

<body>
  
  <div class="container">
    
    <div class="card">
      
      <!-- LOGO -->
      <div class="logo">Park<b>Flow</b></div>
      
      <h2 class="title">Esqueci minha senha</h2>
      
      <p class="subtitle">
        Digite teu email para receber o link
      </p>
      
      <!-- INPUT COM ÍCONE À DIREITA -->
      <div class="input-group">
        <input id="email" type="email" placeholder="Seu email">
        <i class="bi bi-envelope"></i>
      </div>
      
      <button onclick="enviar()" class="btn">
        Enviar link
      </button>
      
    </div>
    
  </div>
  
  <script type="module" src="./forgot-password.js"></script>
  <script src="../utils/global.js"></script>
</body>

</html>
