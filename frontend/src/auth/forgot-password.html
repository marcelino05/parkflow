<!DOCTYPE html>
<html lang="pt-Mz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkFlow - Esqueci Senha</title>

  <link rel="stylesheet" href="../utils/global.css">
  <link rel="stylesheet" href="../utils/toast.css">
</head>

<body>

  <div style="display:flex;justify-content:center;align-items:center;height:100vh;">

    <div style="
      width:360px;
      padding:25px;
      border-radius:var(--radius);
      box-shadow:var(--sombra);
      background:var(--card);
      color:var(--texto);
    ">

      <h2 style="color:var(--cor-primaria);margin-bottom:10px;">
        Esqueci minha senha
      </h2>

      <p style="color:var(--sub);font-size:14px;margin-bottom:15px;">
        Digite teu email para receber o link
      </p>

      <input id="email" type="email" placeholder="Seu email"
        style="
          width:100%;
          padding:10px;
          border:1px solid var(--borda);
          border-radius:8px;
          background:transparent;
          color:var(--texto);
        "
      />

      <button onclick="enviar()"
        style="
          width:100%;
          padding:10px;
          margin-top:15px;
          background:var(--cor-primaria);
          color:white;
          border-radius:8px;
          cursor:pointer;
        ">
        Enviar link
      </button>

    </div>

  </div>

  <script type="module" src="./forgot-password.js"></script>

</body>
</html>
