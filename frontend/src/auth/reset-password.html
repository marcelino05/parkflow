<!DOCTYPE html>
<html lang="pt-Mz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkFlow - Reset Password</title>
  <link rel="stylesheet" href="../utils/global.css">
  <link rel="stylesheet" href="../utils/toast.css">
  
</head>

<body style="background: var(--fundo);">
  
  <div style="display:flex;justify-content:center;align-items:center;height:100vh;">
    
    <div style="
      width:360px;
      padding:25px;
      border-radius:var(--radius);
      box-shadow:var(--sombra);
      background:var(--card);
      color:var(--texto);
      border: 1px solid var(--borda);
    ">
      
      <h2 style="color:var(--cor-primaria);margin-bottom:10px;">
        Nova senha
      </h2>
      
      <p style="color:var(--sub);font-size:14px;margin-bottom:15px;">
        Define e confirma a tua nova senha
      </p>
      
      <input id="senha" type="password" placeholder="Nova senha" style="
          width:100%;
          padding:10px;
          border:1px solid var(--borda);
          border-radius:8px;
          background:transparent;
          color:var(--texto);
          margin-top:10px;
        " />
      
      <input id="confirmar" type="password" placeholder="Confirmar senha" style="
          width:100%;
          padding:10px;
          border:1px solid var(--borda);
          border-radius:8px;
          background:transparent;
          color:var(--texto);
          margin-top:10px;
        " />
      
      <button id="btn" style="
          width:100%;
          padding:10px;
          margin-top:15px;
          background:var(--cor-primaria);
          color:white;
          border-radius:8px;
          cursor:pointer;
        ">
        Redefinir senha
      </button>
      
    </div>
    
  </div>
  
  <script type="module" src="./reset-password.js"></script>
  
</body>

</html>
