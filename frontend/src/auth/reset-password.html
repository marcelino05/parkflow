<!DOCTYPE html>
<html lang="pt-Mz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkFlow - Reset Password</title>
  
  <link rel="stylesheet" href="../utils/global.css">
  <link rel="stylesheet" href="../utils/toast.css">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--fundo);
    }
    
    .card {
      width: 380px;
      padding: 28px;
      border-radius: var(--radius);
      background: var(--card);
      color: var(--texto);
      box-shadow: var(--sombra);
      border: 1px solid var(--borda);
      
    }
    
    .logo {
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 18px;
      color: var(--cor-primaria);
      text-align: center;

      
    }
    
    .title {
      color: var(--texto);
      margin-bottom: 8px;
      font-size: 1.2em;
      text-align: center;
      
    }
    
    .subtitle {
      color: var(--sub);
      font-size: 13px;
      margin-bottom: 18px;
      text-align: center;
      
    }
    
    .input-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--borda);
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 10px;
      transition: 0.2s;
    }
    
    .input-group:focus-within {
      border-color: var(--cor-primaria);
    }
    
    .input-group input {
      width: 100%;
      background: transparent;
      color: var(--texto);
      font-size: 1em;
      font-weight: bold;
    }
    
    .input-group i {
      margin-left: 10px;
      color: var(--sub);
      font-size: 18px;
    }
    
    .btn {
      width: 100%;
      padding: 11px;
      margin-top: 16px;
      background: var(--cor-primaria);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    
    .btn:hover {
      background: var(--cor-primaria-hover);
    }
  </style>
</head>

<body>
  
  <div class="container">
    
    <div class="card">
      
      <!-- LOGO -->
      <div class="logo">Park<b>Flow</b></div>
      
      <h2 class="title">Nova senha</h2>
      
      <p class="subtitle">
        Define e confirma a tua nova senha
      </p>
      
      <!-- SENHA -->
      <div class="input-group">
        <input id="senha" type="password" placeholder="Nova senha">
        <i class="bi bi-lock"></i>
      </div>
      
      <!-- CONFIRMAR -->
      <div class="input-group">
        <input id="confirmar" type="password" placeholder="Confirmar senha">
        <i class="bi bi-lock-fill"></i>
      </div>
      
      <button id="btn" class="btn">
        Redefinir senha
      </button>
      
    </div>
    
  </div>
  
  <script type="module" src="./reset-password.js"></script>
  <script src="../utils/global.js"></script>
</body>
</html>
