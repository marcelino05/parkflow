<!DOCTYPE html>
<html lang="pt-Mz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkFlow - Reset Password</title>

  <link rel="stylesheet" href="../utils/global.css">
</head>

<body>

  <div style="display:flex;justify-content:center;align-items:center;height:100vh;">

    <div style="
      width:360px;
      padding:25px;
      border-radius:var(--radius);
      box-shadow:var(--sombra);
      background:var(--card);
      color:var(--texto);
    ">

      <h2 style="color:var(--cor-primaria);margin-bottom:10px;">
        Nova senha
      </h2>

      <p style="color:var(--sub);font-size:14px;margin-bottom:15px;">
        Define uma nova senha segura para tua conta
      </p>

      <input id="senha" type="password" placeholder="Nova senha"
        style="
          width:100%;
          padding:10px;
          border:1px solid var(--borda);
          border-radius:8px;
          background:transparent;
          color:var(--texto);
          margin-top:10px;
        "
      />

      <button onclick="resetar()"
        style="
          width:100%;
          padding:10px;
          margin-top:15px;
          background:var(--cor-primaria);
          color:white;
          border-radius:8px;
          cursor:pointer;
          transition:0.3s;
        "
        onmouseover="this.style.background='var(--cor-primaria-hover)'"
        onmouseout="this.style.background='var(--cor-primaria)'"
      >
        Redefinir senha
      </button>

      <p id="msg" style="margin-top:10px;font-size:13px;"></p>

    </div>

  </div>

  <script>
    function getToken() {
      const url = new URL(window.location.href);
      return url.searchParams.get("token");
    }

    async function resetar() {
      const senha = document.getElementById("senha").value;
      const msg = document.getElementById("msg");
      const token = getToken();

      if (!senha) {
        msg.innerText = "Digite a nova senha";
        msg.style.color = "var(--cor-erro)";
        return;
      }

      msg.innerText = "Processando...";

      const res = await fetch(
        `http://localhost:5000/auth/resetar-senha/${token}`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ senha })
        }
      );

      const data = await res.json();

      msg.innerText = data.message;
      msg.style.color = data.success ? "var(--cor-sucesso)" : "var(--cor-erro)";

      // redireciona depois de sucesso
      if (data.success) {
        setTimeout(() => {
          window.location.href = "../auth/auth.html";
        }, 1500);
      }
    }
  </script>

</body>
</html>
