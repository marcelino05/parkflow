<!DOCTYPE html>
<html lang="pt-Mz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParkFlow - Esqueci Senha</title>

  <link rel="stylesheet" href="../utils/global.css">
</head>

<body class="fundo">

  <div style="display:flex;justify-content:center;align-items:center;height:100vh;">

    <div class="card" style="
      width:360px;
      padding:25px;
      border-radius:var(--radius);
      box-shadow:var(--sombra);
      background:var(--card);
      color:var(--texto);
    ">

      <h2 style="margin-bottom:10px;color:var(--cor-primaria);">
        Esqueci minha senha
      </h2>

      <p style="color:var(--sub);font-size:14px;margin-bottom:15px;">
        Digite teu email para receber o link de recuperação
      </p>

      <input id="email" type="email" placeholder="Seu email"
        style="
          width:100%;
          padding:10px;
          border:1px solid var(--borda);
          border-radius:8px;
          margin-top:10px;
          background:transparent;
          color:var(--texto);
        "
      />

      <button onclick="enviar()"
        style="
          width:100%;
          padding:10px;
          margin-top:15px;
          background:var(--cor-primaria);
          color:white;
          border-radius:8px;
          cursor:pointer;
          transition:0.3s;
        "
        onmouseover="this.style.background='var(--cor-primaria-hover)'"
        onmouseout="this.style.background='var(--cor-primaria)'"
      >
        Enviar link
      </button>

      <p id="msg" style="margin-top:10px;font-size:13px;"></p>

    </div>

  </div>

  <script>
    async function enviar() {
      const email = document.getElementById("email").value;
      const msg = document.getElementById("msg");

      msg.innerText = "Enviando...";

      const res = await fetch("http://localhost:5000/auth/esqueci-senha", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email })
      });

      const data = await res.json();

      msg.innerText = data.message;
      msg.style.color = data.success ? "var(--cor-sucesso)" : "var(--cor-erro)";
    }
  </script>

</body>
</html>
