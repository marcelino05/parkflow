<!DOCTYPE html>
<html lang="pt-Mz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>autenticação parkflow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./auth.css">
  <link rel="stylesheet" href="../utils/toast.css">
  <link rel="stylesheet" href="../utils/global.css">
</head>
<body>
  <main class="container">
    
    <!-- FORMULÁRIO DE Login -->
    <section class="form-box login">
      <form action="#" id="form-login">
        
        <h2>Login</h2>
        <p id="login-msg"></p>
        
        <div class="input box">
          <input type="text" placeholder="Email" autocomplete="email" id="emailLogin">
          <i class="bi bi-envelope"></i>
        </div>
        
        <div class="input box">
          <input type="password" class="password" placeholder="Senha" autocomplete="current-password" id="passwordLogin">
          <i class="bi bi-eye toggle-password"></i>
        </div>
        
        <div class="forgot-link">
          <a href="./forgot-password.html" >Esqueci a senha <i class="bi bi-unlock2"></i> </a>
          <!-- ICON -->
        </div>
        
        <button type="submit" class="btn">Entrar</button>
        
        
      </form>
    </section><!-- FIM SESSAO LOGIN -->
    
    
    <!--  FORMULÁRIO DE REGISTRO  -->
    <section class="form-box register">
      <form action="#" id="formRegister">
        
        <h2>Cadastrar-se</h2>
        <p id="register-msg"></p>
        
        <div class="input box">
          <input type="text" placeholder="Nome" id="nameRegister">
          <i class="bi bi-person"></i>
        </div>
        
        <div class="input box">
          <input type="text" placeholder="Telefone (ex: 83XXXXXXX)" id="telephone">
          <i class="bi bi-telephone"></i>
        </div>
        
        <div class="input box">
          <input type="text" placeholder="Email" autocomplete="email" id="emailRegister">
          <i class="bi bi-envelope"></i>
        </div>
        
        <div class="input box">
          <input type="password" class="password" placeholder="Senha" autocomplete="new-password" id="passwordRegister">
          <i class="bi bi-eye toggle-password"></i>
        </div>
        
        <button type="submit" class="btn">Cadastrar</button>
        
      </form>
      
    </section>
    
    <!-- MUDAR DIREÇÃO DO FORMULARIO -->
    <section class="toggle-box">
      
      <!-- MUDAR PARA DIREITA -->
      <article class="toggle-panel toggle-right">
        <h1>Crie sua conta para começar</h1>
        <p class="p">Já tenho uma conta?</p>
        <button class="btn register">Login</button>
      </article>
      
      <!-- MUDAR PARA ESQUERDA -->
      <article class="toggle-panel toggle-left">
        <h1>Bem-Vindo de volta</h1>
        <p class="p">Não tenho conta?</p>
        <button class="btn login">Criar conta</button>
      </article>
    </section>
  </main>
</body>
<script src="./auth-config.js" defer></script>
<script type="module" src="./auth.js" defer></script>
<script src="../utils/global.js" defer></script>
</html>
